name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter shell
        run: flutter create --org com.reclaim --project-name reclaim --platforms=android build_app
      - name: Add Reclaim code
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test build_app/analysis_options.yaml
          cp -r lib build_app/lib
          cp -r android_overlay/* build_app/android/
      - name: Build
        run: cd build_app && flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: reclaim-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
